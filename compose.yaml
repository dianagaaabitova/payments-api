x-service: &service
  image: payments-test-service:local
  build:
    context: .
    target: runtime
  env_file: .env
  environment:
    DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://payments:payments@postgres:5432/payments}"
    RABBITMQ_URL: "${RABBITMQ_URL:-amqp://payments:payments@rabbitmq:5672/}"
    WEBHOOK_ALLOWED_HOSTS: "${WEBHOOK_ALLOWED_HOSTS:-[]}"
  init: true

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-payments}"
      POSTGRES_DB: payments
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "payments", "-d", "payments"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: payments
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-payments}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    hostname: rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *service
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *service
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import os, urllib.request;
          request = urllib.request.Request('http://127.0.0.1:8000/health/ready',
          headers={'X-API-Key': os.environ['API_KEY']});
          urllib.request.urlopen(request, timeout=3).close()
      interval: 5s
      timeout: 4s
      retries: 10
    restart: unless-stopped

  consumer:
    <<: *service
    command: ["python", "-m", "payments.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 45s

  test:
    <<: *service
    image: payments-test-service:test
    build:
      context: .
      target: development
    profiles: [test]
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://payments:payments@postgres:5432/payments}"
      RABBITMQ_URL: "${RABBITMQ_URL:-amqp://payments:payments@rabbitmq:5672/}"
      RUN_INTEGRATION: "1"
    command: ["pytest", "-q"]
    depends_on:
      api:
        condition: service_healthy
      consumer:
        condition: service_started

volumes:
  postgres-data:
  rabbitmq-data:
